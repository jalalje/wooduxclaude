<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Woodworking buying decision flow</title><desc id="desc">A four-step diagram: define the job, check capacity, verify space, and buy with a safety margin.</desc><rect width="1200" height="420" rx="28" fill="#faf7f2"/><path d="M260 210h110m200 0h110m200 0h110" stroke="#aa734d" stroke-width="12" stroke-linecap="round"/><g font-family="Arial,sans-serif" text-anchor="middle"><g><rect x="40" y="110" width="220" height="200" rx="24" fill="#4e2f24"/><text x="150" y="170" fill="#f9e9cf" font-size="26" font-weight="700">01</text><text x="150" y="215" fill="white" font-size="22" font-weight="700">Define the job</text><text x="150" y="255" fill="#e3d2bf" font-size="16">What will you build?</text></g><g><rect x="370" y="110" width="220" height="200" rx="24" fill="#734430"/><text x="480" y="170" fill="#f9e9cf" font-size="26" font-weight="700">02</text><text x="480" y="215" fill="white" font-size="22" font-weight="700">Check capacity</text><text x="480" y="255" fill="#e3d2bf" font-size="16">Size, power, accuracy</text></g><g><rect x="700" y="110" width="220" height="200" rx="24" fill="#8f5a3b"/><text x="810" y="170" fill="#f9e9cf" font-size="26" font-weight="700">03</text><text x="810" y="215" fill="white" font-size="22" font-weight="700">Verify space</text><text x="810" y="255" fill="#f2eae0" font-size="16">Room to work safely</text></g><g><rect x="1030" y="110" width="130" height="200" rx="24" fill="#aa734d"/><text x="1095" y="170" fill="#2a1711" font-size="26" font-weight="700">04</text><text x="1095" y="215" fill="#2a1711" font-size="20" font-weight="700">Buy</text><text x="1095" y="255" fill="#2a1711" font-size="15">with margin</text></g></g></svg>
