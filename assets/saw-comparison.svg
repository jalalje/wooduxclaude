<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Woodworking saw comparison</title><desc id="desc">Comparison of track saw, table saw, and circular saw by workspace, accuracy, and sheet breakdown use.</desc><rect width="1200" height="420" rx="28" fill="#faf7f2"/><g font-family="Arial,sans-serif"><text x="70" y="75" fill="#2a1711" font-size="30" font-weight="700">Choose by the work, not the hype</text><g fill="#4e2f24" font-size="21" font-weight="700"><text x="70" y="140">Tool</text><text x="380" y="140">Best for</text><text x="780" y="140">Space</text></g><g font-size="20"><path d="M60 160h1080M60 235h1080M60 310h1080" stroke="#e3d2bf" stroke-width="2"/><text x="70" y="210" fill="#734430" font-weight="700">Track saw</text><text x="380" y="210" fill="#30231e">Accurate sheet breakdown</text><text x="780" y="210" fill="#30231e">Low footprint</text><text x="70" y="285" fill="#734430" font-weight="700">Table saw</text><text x="380" y="285" fill="#30231e">Repeatable ripping</text><text x="780" y="285" fill="#30231e">Permanent space</text><text x="70" y="360" fill="#734430" font-weight="700">Circular saw</text><text x="380" y="360" fill="#30231e">Lowest-cost starting point</text><text x="780" y="360" fill="#30231e">Most portable</text></g></g></svg>
