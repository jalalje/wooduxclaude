<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Dust collection tool matching diagram</title><desc id="desc">A visual comparison matching a shop vacuum with hand tools and a dedicated dust collector with stationary machines.</desc><rect width="1200" height="420" rx="28" fill="#faf7f2"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="60" y="65" width="450" height="290" rx="26" fill="#e3d2bf"/><text x="285" y="125" fill="#4e2f24" font-size="30" font-weight="700">SHOP VAC</text><text x="285" y="175" fill="#734430" font-size="22">High suction • small hose</text><text x="285" y="235" fill="#30231e" font-size="20">Hand tools</text><text x="285" y="275" fill="#30231e" font-size="20">Router</text><text x="285" y="315" fill="#30231e" font-size="20">Occasional sanding</text><rect x="690" y="65" width="450" height="290" rx="26" fill="#4e2f24"/><text x="915" y="125" fill="#f9e9cf" font-size="30" font-weight="700">DEDICATED COLLECTOR</text><text x="915" y="175" fill="#e3d2bf" font-size="22">High airflow • larger hose</text><text x="915" y="235" fill="white" font-size="20">Table saw</text><text x="915" y="275" fill="white" font-size="20">Planer</text><text x="915" y="315" fill="white" font-size="20">Stationary machines</text><path d="M530 210h120" stroke="#aa734d" stroke-width="14" stroke-linecap="round"/></g></svg>
